# Runs the image loaded from webmusicfolder.tar.gz (no build on the server).
services:
  webmusicfolder:
    image: webmusicfolder:latest
    container_name: webmusicfolder
    restart: unless-stopped
    ports:
      - "${WMF_PORT_HOST:-8080}:8080"
    environment:
      WMF_PASSWORD: "${WMF_PASSWORD:?set WMF_PASSWORD in .env}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
    volumes:
      - "${WMF_MUSIC_HOST:-./music}:/music"
      - "./data:/data"
