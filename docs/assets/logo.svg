<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="WebMusicFolder logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)" stroke="#30363d" stroke-width="3"/>
  <!-- folder tab and body -->
  <path d="M40 92a14 14 0 0 1 14-14h42l16 18h90a14 14 0 0 1 14 14v70a14 14 0 0 1-14 14H54a14 14 0 0 1-14-14z" fill="none" stroke="#2f81f7" stroke-width="6" stroke-linejoin="round" opacity="0.55"/>
  <!-- music note, glyph centered at 128,128 -->
  <g transform="translate(128 124) scale(5.2) translate(-11 -12)" fill="#2f81f7" filter="url(#glow)">
    <path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h7V3z"/>
  </g>
  <!-- equalizer along the bottom edge of the folder -->
  <g fill="url(#bar)">
    <rect x="76" y="188" width="12" height="14" rx="3"/>
    <rect x="98" y="178" width="12" height="24" rx="3"/>
    <rect x="122" y="170" width="12" height="32" rx="3"/>
    <rect x="146" y="182" width="12" height="20" rx="3"/>
    <rect x="168" y="190" width="12" height="12" rx="3"/>
  </g>
</svg>
